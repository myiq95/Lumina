<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumina">
  <meta name="theme-color" content="#0f0f12">
  <meta name="description" content="프리미엄 오프라인 독서 앱 - Lumina">
  <title>Lumina</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.webmanifest">
  
  <!-- Apple Touch Icons (PNG required for iPhone home screen) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
  
  <!-- Favicon / Android -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <style>
    :root {
      --bg: #faf9f7;
      --bg-secondary: #f0eeea;
      --text: #1a1a1a;
      --text-secondary: #5c5c5c;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.12);
      --border: rgba(0,0,0,0.08);
      --card: #ffffff;
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
      --radius: 16px;
      --font-body: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: "Noto Serif KR", "Apple Myungjo", Georgia, serif;
      --font-size: 18px;
      --line-height: 1.85;
      --letter-spacing: 0.01em;
      --max-width: 680px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="night"] {
      --bg: #0f0f12;
      --bg-secondary: #1a1a1f;
      --text: #e8e6e3;
      --text-secondary: #a0a0a8;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.15);
      --border: rgba(255,255,255,0.08);
      --card: #18181c;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* ===== Screens ===== */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .screen.active {
      display: flex;
    }

    /* ===== HOME ===== */
    #home {
      background: linear-gradient(165deg, var(--bg) 0%, var(--bg-secondary) 100%);
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      text-align: center;
    }

    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      border-radius: 24px;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px rgba(99, 102, 241, 0.35);
      animation: float 4s ease-in-out infinite;
    }
    .logo svg {
      width: 48px;
      height: 48px;
      stroke: white;
      fill: none;
      stroke-width: 2.2;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .app-name {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .app-tagline {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 48px;
      letter-spacing: 0.02em;
    }

    .home-actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 300px;
    }

    .home-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .home-btn:active {
      transform: scale(0.97);
    }
    .home-btn.primary {
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      color: white;
      border: none;
      box-shadow: 0 8px 28px rgba(99, 102, 241, 0.35);
    }
    .home-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .privacy-note {
      margin-top: 36px;
      font-size: 12px;
      color: var(--text-secondary);
      opacity: 0.7;
      max-width: 280px;
      line-height: 1.5;
    }

    /* ===== LIBRARY ===== */
    #library {
      background: var(--bg);
    }

    .lib-header {
      padding: calc(16px + var(--safe-top)) 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      z-index: 10;
    }

    .lib-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .lib-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: var(--bg-secondary);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:active {
      transform: scale(0.92);
      background: var(--accent-soft);
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .lib-tabs {
      display: flex;
      padding: 12px 20px 0;
      gap: 8px;
    }

    .lib-tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .lib-tab.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .lib-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px calc(24px + var(--safe-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .book-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      gap: 16px;
      align-items: flex-start;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .book-card:active {
      transform: scale(0.985);
    }

    .book-cover {
      width: 52px;
      height: 72px;
      border-radius: 8px;
      background: linear-gradient(135deg, #a78bfa33, #6366f133);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 22px;
      color: var(--accent);
    }

    .book-info {
      flex: 1;
      min-width: 0;
    }

    .book-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-meta {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 4px;
      background: var(--bg-secondary);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #6366f1);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .book-delete {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.6;
      transition: all 0.2s;
    }
    .book-delete:hover, .book-delete:active {
      opacity: 1;
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
    }
    .book-delete svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .empty-state svg {
      width: 64px;
      height: 64px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      opacity: 0.4;
      margin-bottom: 16px;
    }

    /* ===== READER ===== */
    #reader {
      background: var(--bg);
    }

    .reader-toolbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: calc(10px + var(--safe-top)) 12px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
      transform: translateY(0);
      opacity: 1;
    }
    .reader-toolbar.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .reader-toolbar .icon-btn {
      background: transparent;
    }

    .reader-title {
      font-size: 14px;
      font-weight: 600;
      max-width: 50%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .reader-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(70px + var(--safe-top)) 24px calc(80px + var(--safe-bottom));
      scroll-behavior: smooth;
    }

    .reader-content.serif {
      font-family: var(--font-serif);
    }

    .content-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      font-size: var(--font-size);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing);
      color: var(--text);
    }

    /* Beautiful typography */
    .content-inner h1 {
      font-size: 1.8em;
      font-weight: 700;
      margin: 1.6em 0 0.8em;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--text);
      border-bottom: 2px solid var(--accent-soft);
      padding-bottom: 0.4em;
    }

    .content-inner h2 {
      font-size: 1.4em;
      font-weight: 700;
      margin: 1.8em 0 0.7em;
      letter-spacing: -0.01em;
      color: var(--accent);
    }

    .content-inner h3 {
      font-size: 1.2em;
      font-weight: 600;
      margin: 1.5em 0 0.6em;
      color: var(--text);
    }

    .content-inner p {
      margin: 0 0 1.2em;
      text-align: justify;
      word-break: keep-all;
    }

    .content-inner blockquote {
      margin: 1.4em 0;
      padding: 1em 1.2em;
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      font-style: italic;
      color: var(--text);
    }

    .content-inner blockquote p {
      margin: 0;
    }

    .content-inner hr {
      border: none;
      height: 1px;
      background: var(--border);
      margin: 2.5em 0;
    }

    .chapter-marker {
      text-align: center;
      margin: 2.5em 0 1.5em;
      font-size: 0.85em;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Bottom bar (auto-hide) */
    .reader-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
      transform: translateY(0);
      opacity: 1;
    }
    .reader-bottom.hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    .bottom-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 10px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .bottom-btn:active {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .bottom-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }
    .bottom-btn.active {
      color: var(--accent);
    }

    /* ===== MODALS / PANELS ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.active {
      display: flex;
    }

    .panel {
      background: var(--card);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px 20px calc(24px + var(--safe-bottom));
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
    }

    .panel-close {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: var(--bg-secondary);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .panel-close svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* Settings */
    .setting-group {
      margin-bottom: 24px;
    }
    .setting-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .font-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .font-opt {
      flex: 1;
      min-width: 80px;
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      font-family: inherit;
      color: var(--text);
    }
    .font-opt.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .font-opt.serif {
      font-family: var(--font-serif);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--bg-secondary);
      outline: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .slider-value {
      font-size: 14px;
      font-weight: 600;
      min-width: 40px;
      text-align: right;
      color: var(--accent);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }
    .toggle {
      width: 50px;
      height: 30px;
      border-radius: 15px;
      background: var(--bg-secondary);
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.on {
      background: var(--accent);
    }
    .toggle::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: white;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .toggle.on::after {
      transform: translateX(20px);
    }

    /* TOC */
    .toc-list {
      list-style: none;
    }
    .toc-item {
      padding: 14px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .toc-item:active, .toc-item:hover {
      background: var(--accent-soft);
    }
    .toc-item.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* Paste modal */
    .paste-area {
      width: 100%;
      min-height: 180px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      font-size: 15px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      resize: vertical;
      outline: none;
    }
    .paste-area:focus {
      border-color: var(--accent);
    }

    .panel-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      color: white;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 16px;
    }
    .panel-btn:active {
      opacity: 0.9;
    }

    /* TTS controls */
    .tts-status {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 8px;
    }

    /* Loading */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .loading-overlay.active {
      display: flex;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Hidden file input */
    #fileInput {
      display: none;
    }

    /* Progress toast */
    .toast {
      position: fixed;
      bottom: calc(100px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--card);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      opacity: 0;
      transition: all 0.3s;
      z-index: 150;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <!-- Loading -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div style="color:var(--text-secondary);font-size:14px;">파일을 불러오는 중...</div>
  </div>

  <!-- HOME SCREEN -->
  <div class="screen active" id="home">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
    </div>
    <h1 class="app-name">Lumina</h1>
    <p class="app-tagline">고요한 독서의 공간</p>
    
    <div class="home-actions">
      <button class="home-btn primary" id="btnLibrary">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        서재
      </button>
      <button class="home-btn" id="btnPaste">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        텍스트 붙여넣기
      </button>

  <!-- External libs (CDN, cached by SW when possible) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

  <script>
    // ========== CONFIG & STATE ==========
    const APP = {
      books: [],
      currentBookId: null,
      currentTab: 'reading',
      settings: {
        font: 'sans',
        fontSize: 18,
        letterSpacing: 1,
        lineHeight: 1.85,
        night: false
      },
      lastScrollY: 0,
      toolbarVisible: true,
      ttsUtterance: null,
      isSpeaking: false
    };

    // ========== STORAGE ==========
    const DB = {
      KEY: 'lumina_books_v1',
      SETTINGS: 'lumina_settings_v1',

      load() {
        try {
          const raw = localStorage.getItem(this.KEY);
          APP.books = raw ? JSON.parse(raw) : [];
        } catch (e) {
          APP.books = [];
        }
        try {
          const s = localStorage.getItem(this.SETTINGS);
          if (s) Object.assign(APP.settings, JSON.parse(s));
        } catch (e) {}
        this.applySettings();
      },

      save() {
        localStorage.setItem(this.KEY, JSON.stringify(APP.books));
      },

      saveSettings() {
        localStorage.setItem(this.SETTINGS, JSON.stringify(APP.settings));
        this.applySettings();
      },

      applySettings() {
        const root = document.documentElement;
        root.style.setProperty('--font-size', APP.settings.fontSize + 'px');
        root.style.setProperty('--letter-spacing', (APP.settings.letterSpacing / 100) + 'em');
        root.style.setProperty('--line-height', APP.settings.lineHeight);
        document.body.dataset.theme = APP.settings.night ? 'night' : '';
        const content = document.getElementById('contentInner');
        if (content) {
          content.classList.toggle('serif', APP.settings.font === 'serif');
        }
        // UI sync
        document.getElementById('fontSizeSlider').value = APP.settings.fontSize;
        document.getElementById('fontSizeVal').textContent = APP.settings.fontSize;
        document.getElementById('letterSpacingSlider').value = APP.settings.letterSpacing;
        document.getElementById('letterSpacingVal').textContent = APP.settings.letterSpacing;
        document.getElementById('lineHeightSlider').value = Math.round(APP.settings.lineHeight * 100);
        document.getElementById('lineHeightVal').textContent = APP.settings.lineHeight.toFixed(2);
        document.getElementById('nightToggle').classList.toggle('on', APP.settings.night);
        document.querySelectorAll('.font-opt').forEach(el => {
          el.classList.toggle('active', el.dataset.font === APP.settings.font);
        });
      }
    };

    // ========== UTILITIES ==========
    function showToast(msg, ms = 2200) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('active', show);
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function formatDate(ts) {
      const d = new Date(ts);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    // Encoding detection & decode for Korean
    async function decodeText(buffer) {
      // Try UTF-8 first
      try {
        const dec = new TextDecoder('utf-8', { fatal: true });
        return dec.decode(buffer);
      } catch (e) {}
      // Try EUC-KR / CP949
      try {
        const dec = new TextDecoder('euc-kr');
        return dec.decode(buffer);
      } catch (e) {}
      // Fallback UTF-8 non-fatal
      return new TextDecoder('utf-8').decode(buffer);
    }

    // ========== FILE PARSERS ==========
    async function parseFile(file) {
      const name = file.name;
      const ext = name.split('.').pop().toLowerCase();
      const buffer = await file.arrayBuffer();

      let title = name.replace(/\.[^.]+$/, '');
      let content = '';
      let toc = [];

      if (ext === 'txt' || ext === 'md') {
        let raw = await decodeText(buffer);
        if (ext === 'md' && typeof marked !== 'undefined') {
          const built = buildContentAndToc(marked.parse(raw), false);
          content = built.content;
          toc = built.toc;
        } else {
          const built = buildContentAndToc(raw, true);
          content = built.content;
          toc = built.toc;
        }
      }
      else if (ext === 'html' || ext === 'htm') {
        let raw = await decodeText(buffer);
        raw = raw.replace(/<script[\s\S]*?<\/script>/gi, '')
                 .replace(/<style[\s\S]*?<\/style>/gi, '');
        const built = buildContentAndToc(raw, false);
        content = built.content;
        toc = built.toc;
      }
      else if (ext === 'docx' && typeof mammoth !== 'undefined') {
        const result = await mammoth.convertToHtml({ arrayBuffer: buffer });
        const built = buildContentAndToc(result.value, false);
        content = built.content;
        toc = built.toc;
      }
      else if (ext === 'pdf' && typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        let pages = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          pages.push(extractPdfPageText(textContent));
        }
        // PDF도 챕터 패턴 감지 시도 후, 부족하면 페이지 단위 목차
        const built = buildContentAndToc(pages.join('\n\n'), true);
        content = built.content;
        if (built.toc && built.toc.length >= 2 && !built.toc[0].id.startsWith('arb-') && built.toc[0].title !== '본문') {
          toc = built.toc;
        } else {
          // 페이지 기반 목차 + id 주입
          const parser = new DOMParser();
          const doc = parser.parseFromString('<div id="root">' + content + '</div>', 'text/html');
          const root = doc.getElementById('root');
          const children = Array.from(root.children);
          toc = [];
          const step = Math.max(1, Math.ceil(children.length / Math.min(pages.length, 30)));
          for (let i = 0, p = 0; i < children.length && p < pages.length; i += step, p++) {
            const id = 'pdf-page-' + (p + 1);
            if (children[i]) children[i].id = id;
            toc.push({ id, title: `페이지 ${p + 1}`, level: 1 });
          }
          content = root.innerHTML;
        }
      }
      else if (ext === 'epub' && typeof JSZip !== 'undefined') {
        const zip = await JSZip.loadAsync(buffer);
        // Find OPF
        let opfPath = null;
        const container = await zip.file('META-INF/container.xml')?.async('string');
        if (container) {
          const match = container.match(/full-path=["']([^"']+)["']/);
          if (match) opfPath = match[1];
        }
        if (!opfPath) {
          // fallback search
          for (const path of Object.keys(zip.files)) {
            if (path.endsWith('.opf')) { opfPath = path; break; }
          }
        }
        if (!opfPath) throw new Error('EPUB 구조를 찾을 수 없습니다.');

        const opfDir = opfPath.substring(0, opfPath.lastIndexOf('/') + 1);
        const opfText = await zip.file(opfPath).async('string');
        const parser = new DOMParser();
        const opfDoc = parser.parseFromString(opfText, 'application/xml');

        // Title
        const titleEl = opfDoc.querySelector('metadata > title, dc\\:title, title');
        if (titleEl) title = titleEl.textContent.trim() || title;

        // Spine
        const manifest = {};
        opfDoc.querySelectorAll('manifest > item, item').forEach(item => {
          const id = item.getAttribute('id');
          const href = item.getAttribute('href');
          if (id && href) manifest[id] = opfDir + href;
        });

        const spine = [];
        opfDoc.querySelectorAll('spine > itemref, itemref').forEach(ref => {
          const idref = ref.getAttribute('idref');
          if (manifest[idref]) spine.push(manifest[idref]);
        });

        // TOC (NCX or NAV)
        let ncxPath = null;
        opfDoc.querySelectorAll('manifest > item, item').forEach(item => {
          if (item.getAttribute('media-type') === 'application/x-dtbncx+xml') {
            ncxPath = opfDir + item.getAttribute('href');
          }
        });
        if (ncxPath && zip.file(ncxPath)) {
          const ncxText = await zip.file(ncxPath).async('string');
          const ncxDoc = parser.parseFromString(ncxText, 'application/xml');
          ncxDoc.querySelectorAll('navPoint').forEach((np, idx) => {
            const label = np.querySelector('navLabel > text, text')?.textContent?.trim();
            if (label) toc.push({ id: 'epub-ch-' + idx, title: label, level: 1 });
          });
        }

        // Extract content
        let htmlParts = [];
        for (let i = 0; i < spine.length; i++) {
          const path = spine[i];
          const file = zip.file(path);
          if (!file) continue;
          let chapterHtml = await file.async('string');
          // Basic cleanup
          chapterHtml = chapterHtml.replace(/<script[\s\S]*?<\/script>/gi, '')
                                   .replace(/<style[\s\S]*?<\/style>/gi, '')
                                   .replace(/<link[^>]*>/gi, '');
          // Relative images ignored for simplicity
          htmlParts.push(`<div class="epub-chapter" id="epub-ch-${i}">${chapterHtml}</div>`);
          if (!toc.length) {
            // try extract heading
            const tmp = parser.parseFromString(chapterHtml, 'text/html');
            const h = tmp.querySelector('h1, h2, title');
            toc.push({
              id: 'epub-ch-' + i,
              title: h ? h.textContent.trim().slice(0, 60) : `챕터 ${i + 1}`,
              level: 1
            });
          }
        }
        content = htmlParts.join('\n');
        if (!toc.length) {
          const built = buildContentAndToc(content, false);
          content = built.content;
          toc = built.toc;
        } else {
          // NCX 목차가 있어도 본문 안 챕터 승격 + 대화 강조
          content = promoteChapterParagraphs(content);
          content = enhanceDialogue(content);
        }
      }
      else {
        // fallback as text
        const built = buildContentAndToc(await decodeText(buffer), true);
        content = built.content;
        toc = built.toc;
      }

      return { title, content, toc, type: ext };
    }

    // ========== PDF 텍스트 추출 (좌표 기반 줄/단락 복원) ==========
    function extractPdfPageText(textContent) {
      const items = (textContent.items || []).filter(it => it.str && it.str.length);
      if (!items.length) return '';

      // transform: [scaleX, skewY, skewX, scaleY, translateX, translateY]
      const rows = items.map(it => {
        const t = it.transform || [1, 0, 0, 1, 0, 0];
        return {
          str: it.str,
          x: t[4],
          y: t[5],
          h: Math.abs(t[3]) || Math.abs(it.height) || 10
        };
      });

      // Y 내림차순(PDF 좌표계), 같으면 X 오름차순
      rows.sort((a, b) => {
        const dy = b.y - a.y;
        if (Math.abs(dy) > 2) return dy;
        return a.x - b.x;
      });

      const lines = [];
      let cur = [];
      let lastY = null;
      let lastH = 12;

      for (const r of rows) {
        if (lastY === null) {
          cur.push(r);
          lastY = r.y;
          lastH = r.h;
          continue;
        }
        const gap = Math.abs(lastY - r.y);
        // 같은 줄: 높이의 약 0.4배 이내
        if (gap < Math.max(2, lastH * 0.45)) {
          cur.push(r);
        } else {
          // 줄 완성
          cur.sort((a, b) => a.x - b.x);
          const lineText = cur.map(c => c.str).join('').replace(/\s+/g, ' ').trim();
          if (lineText) {
            lines.push({ text: lineText, y: lastY, gapFromPrev: gap, h: lastH });
          }
          cur = [r];
          lastY = r.y;
          lastH = r.h;
        }
      }
      if (cur.length) {
        cur.sort((a, b) => a.x - b.x);
        const lineText = cur.map(c => c.str).join('').replace(/\s+/g, ' ').trim();
        if (lineText) lines.push({ text: lineText, y: lastY, gapFromPrev: 0, h: lastH });
      }

      // 줄 간격이 크면 단락 구분
      let out = '';
      for (let i = 0; i < lines.length; i++) {
        const L = lines[i];
        if (i > 0) {
          const prev = lines[i - 1];
          const gap = Math.abs(prev.y - L.y);
          const avgH = (prev.h + L.h) / 2;
          if (gap > avgH * 1.6) out += '\n\n';
          else out += '\n';
        }
        out += L.text;
      }
      return out;
    }

    // ========== 한글 소설/문서 챕터 감지 ==========
    function isChapterLine(text) {
      if (!text) return false;
      const t = text.trim();
      if (t.length === 0 || t.length > 100) return false;

      if (/^제\s*[0-9０-９일이삼사오육륙칠팔구십백천만]+\s*[장화편부절막권회]/.test(t)) return true;
      if (/^제\s*\d+\s*[장화편부절막권회]/.test(t)) return true;
      if (/^[【\[\(〈《「『≪〈\<\-\*\★●◆■□▶▷※]*\s*\d+\s*[장화편부절막권회]/.test(t)) return true;
      if (/^\d+\s*[\.．、]\s*[장화편부절막권회]/.test(t)) return true;
      if (/^\d{1,3}\s*[\.．:：]\s*.{1,60}$/.test(t) && !/^\d+\s*[\.．:：]\s*\d+/.test(t)) return true;
      if (/^[【\[\(〈《「『≪].{1,50}[】\]\)〉》」』≫]$/.test(t)) return true;
      if (/^[≪〈《].+[≫〉》]$/.test(t)) return true;
      if (/^(Chapter|CHAPTER|Ch\.?|Episode|EP\.?|Part|PART|Volume|Vol\.?|Act|Scene)\s*[\dIVXLCivxlc]+/i.test(t)) return true;
      if (/^(프롤로그|에필로그|서장|종장|서문|후기|발문|머리말|맺음말|서사|중간|막간|인터미션|보너스|외전|번외|특별편)(\s*\d+)?$/i.test(t)) return true;
      if (/^(첫\s*째|둘\s*째|셋\s*째|넷\s*째|다섯\s*째|여섯\s*째|일곱\s*째|여덟\s*째|아홉\s*째|열\s*째)\s*[마당장화편부]/.test(t)) return true;
      if (/^第\s*[0-9一二三四五六七八九十百千]+\s*[章話編部節幕卷回]/.test(t)) return true;
      if (/^\d{1,3}$/.test(t)) return true;
      if (/^[★☆●○◆◇■□▶▷※◎]/.test(t) && t.length < 50) return true;
      if (/^(에피소드|에피소우드|Episode|EP)\s*\.?\s*\d+/i.test(t)) return true;
      if (/^\d{1,3}\s+[가-힣A-Za-z].{0,40}$/.test(t) && t.length < 50) return true;

      return false;
    }

    // 본문 중간에 붙은 챕터 '표기 자체'만 추출 (뒤따르는 본문은 남김)
    const CHAPTER_INLINE_RE = /(?:^|[\n\s])(제\s*\d{1,4}\s*[장화편부절막권회]|제\s*[일이삼사오육륙칠팔구십백천만]+\s*[장화편부절막권회]|\d{1,3}\s*[장화편부절막권회]|Chapter\s*[\dIVXLCivxlc]+|CHAPTER\s*[\dIVXLCivxlc]+|Episode\s*\d+|EP\.?\s*\d+|Part\s*[\dIVXLCivxlc]+|프롤로그|에필로그|서장|종장|외전|번외|【[^】]{1,30}】|≪[^≫]{1,30}≫|〈[^〉]{1,30}〉)(?=[\n\s.。！？!?]|$)/gi;

    // 한 줄로 이어진 텍스트를 독서 가능한 형태로 복원
    function normalizeRawText(text) {
      if (!text) return '';
      let t = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      // 폼피드 → 페이지 구분
      t = t.replace(/\f/g, '\n\n');

      // 과도한 공백 정리 (단, 줄바꿈은 유지)
      t = t.replace(/[ \t]+/g, ' ');
      t = t.replace(/ *\n */g, '\n');

      // 줄 수가 비정상적으로 적으면(벽 텍스트) 문장 단위로 재분할
      const lines = t.split('\n').filter(l => l.trim());
      const totalLen = t.replace(/\s/g, '').length;
      const avgLineLen = lines.length ? totalLen / lines.length : totalLen;

      if (lines.length < 5 || avgLineLen > 200) {
        // 1) 챕터 패턴 앞에 강제 줄바꿈
        t = t.replace(CHAPTER_INLINE_RE, function(m, chap) {
          return '\n\n' + chap.trim() + '\n';
        });

        // 2) 문장 종결 부호 뒤에서 단락 후보 분리
        // 한글/영문 마침표, 물음표, 느낌표, 닫는 따옴표 뒤
        t = t.replace(/([.!?。？！…])\s*(?=[“"「『([{【〈《가-힣A-Za-z0-9])/g, '$1\n');
        t = t.replace(/([”」』"'])\s*(?=[“"「『가-힣A-Za-z])/g, '$1\n');

        // 3) 너무 긴 줄은 추가 분할 (200자 근처 공백)
        const rebuilt = [];
        t.split('\n').forEach(line => {
          const s = line.trim();
          if (!s) { rebuilt.push(''); return; }
          if (s.length <= 220) { rebuilt.push(s); return; }
          let rest = s;
          while (rest.length > 220) {
            // 뒤에서부터 공백/문장부호 찾기
            let cut = -1;
            for (let i = 200; i < Math.min(280, rest.length); i++) {
              if (/[.!?。？！…\s]/.test(rest[i])) cut = i + 1;
            }
            if (cut < 0) cut = 220;
            rebuilt.push(rest.slice(0, cut).trim());
            rest = rest.slice(cut).trim();
          }
          if (rest) rebuilt.push(rest);
        });
        t = rebuilt.join('\n');
      } else {
        // 줄이 어느 정도 있으면, 줄 내부 챕터만 분리
        t = t.replace(CHAPTER_INLINE_RE, function(m, chap) {
          return '\n\n' + chap.trim() + '\n';
        });
      }

      // 연속 빈 줄 정리 (최대 2개)
      t = t.replace(/\n{3,}/g, '\n\n');
      return t.trim();
    }

    function plainToHtml(text) {
      // 먼저 벽 텍스트 / 챕터 인라인 복원
      text = normalizeRawText(text);

      const lines = text.split('\n');
      let html = '';
      let para = [];
      let chapterCount = 0;

      const flushPara = () => {
        if (para.length) {
          const joined = para.join(' ').trim();
          if (joined) {
            // 단락 안이 여전히 너무 길면 문장 단위로 추가 분리
            if (joined.length > 400) {
              const sentences = splitIntoSentences(joined);
              sentences.forEach(s => {
                if (s.trim()) html += '<p>' + escapeHtml(s.trim()) + '</p>\n';
              });
            } else {
              html += '<p>' + escapeHtml(joined) + '</p>\n';
            }
          }
          para = [];
        }
      };

      for (let i = 0; i < lines.length; i++) {
        const trimmed = lines[i].trim();
        if (!trimmed) {
          flushPara();
          continue;
        }

        const prevEmpty = i === 0 || !lines[i - 1].trim();
        const nextEmpty = i === lines.length - 1 || !lines[i + 1].trim();
        const isShort = trimmed.length <= 90;
        const looksChapter = isChapterLine(trimmed);

        if (isShort && looksChapter && (prevEmpty || nextEmpty || chapterCount > 0 || trimmed.length <= 40)) {
          flushPara();
          chapterCount++;
          const id = 'ch-' + chapterCount;
          html += `<h2 id="${id}">${escapeHtml(trimmed)}</h2>\n`;
        } else {
          para.push(trimmed);
        }
      }
      flushPara();
      return html;
    }

    function splitIntoSentences(text) {
      // 문장 단위 분할 (한글 대응)
      const parts = text.split(/(?<=[.!?。？！…])\s+|(?<=[”」』"'])\s+(?=[“"「『가-힣A-Za-z])/);
      const result = [];
      let buf = '';
      for (const p of parts) {
        buf += (buf ? ' ' : '') + p;
        // 어느 정도 길이 모이면 단락으로
        if (buf.length >= 120 && /[.!?。？！…”」』"']$/.test(buf.trim())) {
          result.push(buf.trim());
          buf = '';
        }
      }
      if (buf.trim()) result.push(buf.trim());
      return result.length ? result : [text];
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function enhanceDialogue(html) {
      return html
        .replace(/(<p>)([“「『"].*?[”」』"]|[''].*?[''])(<\/p>)/gs, (m, open, text) => {
          return `<blockquote><p>${text}</p></blockquote>`;
        })
        .replace(/(<p>)([^<]*?[“「『][^<]*?[”」』][^<]*)(<\/p>)/g, (m, open, text) => {
          if (/^[“「『'"]/.test(text.trim()) && /[”」』'"]$/.test(text.trim())) {
            return `<blockquote><p>${text}</p></blockquote>`;
          }
          return m;
        });
    }

    // HTML 안에서도 챕터 승격 + 긴 단락 분할
    function promoteChapterParagraphs(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString('<div id="root">' + html + '</div>', 'text/html');
      const root = doc.getElementById('root');
      let count = root.querySelectorAll('h1,h2,h3').length;

      // 1) 짧은 챕터성 <p> → <h2>
      Array.from(root.querySelectorAll('p')).forEach(p => {
        const text = (p.textContent || '').trim();
        if (text.length > 0 && text.length <= 90 && isChapterLine(text)) {
          const h = doc.createElement('h2');
          count++;
          h.id = 'ch-' + count;
          h.textContent = text;
          p.parentNode.replaceChild(h, p);
        }
      });

      // 2) 벽 텍스트(긴 단일 단락) 분할 + 인라인 챕터 분리
      Array.from(root.querySelectorAll('p')).forEach(p => {
        const text = (p.textContent || '').trim();
        if (text.length < 300) return;

        // 인라인 챕터 분리
        let working = text;
        working = working.replace(CHAPTER_INLINE_RE, function(m, chap) {
          return '\n\n@@CHAPTER@@' + chap.trim() + '\n\n';
        });

        // 문장 단위 단락 분할
        const chunks = [];
        working.split(/\n\n+/).forEach(block => {
          block = block.trim();
          if (!block) return;
          if (block.startsWith('@@CHAPTER@@')) {
            chunks.push({ type: 'h2', text: block.replace('@@CHAPTER@@', '').trim() });
          } else if (block.length > 350) {
            splitIntoSentences(block).forEach(s => {
              if (s.trim()) chunks.push({ type: 'p', text: s.trim() });
            });
          } else {
            chunks.push({ type: 'p', text: block });
          }
        });

        if (chunks.length <= 1) return;

        const frag = doc.createDocumentFragment();
        chunks.forEach(c => {
          if (c.type === 'h2') {
            const h = doc.createElement('h2');
            count++;
            h.id = 'ch-' + count;
            h.textContent = c.text;
            frag.appendChild(h);
          } else {
            const np = doc.createElement('p');
            np.textContent = c.text;
            frag.appendChild(np);
          }
        });
        p.parentNode.replaceChild(frag, p);
      });

      return root.innerHTML;
    }

    function extractTocFromHtml(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString('<div id="root">' + html + '</div>', 'text/html');
      const root = doc.getElementById('root');
      const headings = root.querySelectorAll('h1, h2, h3');
      if (headings.length < 1) return { toc: null, html };

      const toc = [];
      headings.forEach((h, i) => {
        let id = h.id;
        if (!id) {
          id = 'toc-' + i;
          h.id = id;
        }
        const title = h.textContent.trim().slice(0, 80) || `섹션 ${i + 1}`;
        toc.push({
          id,
          title,
          level: parseInt(h.tagName[1], 10) || 2
        });
      });
      return { toc: toc.length ? toc : null, html: root.innerHTML };
    }

    function generateArbitraryToc(html) {
      const textLen = html.replace(/<[^>]+>/g, '').length;
      const parser = new DOMParser();
      const doc = parser.parseFromString('<div id="root">' + html + '</div>', 'text/html');
      const root = doc.getElementById('root');
      const children = Array.from(root.children).filter(el => el.tagName !== 'SCRIPT');

      if (textLen < 2500 || children.length < 6) {
        if (children[0] && !children[0].id) children[0].id = 'start';
        return {
          toc: [{ id: children[0]?.id || 'start', title: '본문', level: 1 }],
          html: root.innerHTML
        };
      }

      // 대략 8~15개 구간으로 나눔
      const targetChunks = Math.min(15, Math.max(6, Math.ceil(textLen / 4000)));
      const chunkSize = Math.max(3, Math.ceil(children.length / targetChunks));
      const toc = [];

      for (let i = 0; i < children.length; i += chunkSize) {
        const id = 'arb-' + i;
        children[i].id = id;
        let preview = (children[i].textContent || '').trim().replace(/\s+/g, ' ').slice(0, 36);
        if (!preview) preview = `구간 ${Math.floor(i / chunkSize) + 1}`;
        if (preview.length >= 36) preview += '…';
        toc.push({ id, title: preview, level: 1 });
      }
      return { toc, html: root.innerHTML };
    }

    // 통합: 콘텐츠 + 목차 생성 (항상 id가 본문에 존재하도록)
    function buildContentAndToc(rawHtmlOrText, isPlainText) {
      let content = isPlainText ? plainToHtml(rawHtmlOrText) : rawHtmlOrText;
      content = promoteChapterParagraphs(content);
      content = enhanceDialogue(content);

      let { toc, html } = extractTocFromHtml(content);
      content = html;

      if (!toc || toc.length < 2) {
        // 헤딩이 거의 없으면 임의 목차 생성 (본문에 id 주입)
        const arb = generateArbitraryToc(content);
        toc = arb.toc;
        content = arb.html;
      }
      return { content, toc };
    }

    // ========== BOOK MANAGEMENT ==========
    function addBook(data) {
      const book = {
        id: uid(),
        title: data.title,
        content: data.content,
        toc: data.toc || [],
        type: data.type || 'txt',
        progress: 0,
        scrollTop: 0,
        finished: false,
        addedAt: Date.now(),
        lastRead: Date.now()
      };
      APP.books.unshift(book);
      DB.save();
      return book;
    }

    function updateBookProgress(id, scrollTop, progress) {
      const book = APP.books.find(b => b.id === id);
      if (!book) return;
      book.scrollTop = scrollTop;
      book.progress = progress;
      book.lastRead = Date.now();
      if (progress > 0.95) book.finished = true;
      DB.save();
    }

    function deleteBook(id) {
      APP.books = APP.books.filter(b => b.id !== id);
      DB.save();
      renderLibrary();
      showToast('삭제되었습니다');
    }

    function markFinished(id) {
      const book = APP.books.find(b => b.id === id);
      if (book) {
        book.finished = true;
        book.progress = 1;
        DB.save();
        showToast('다 읽은 목록으로 이동했습니다');
      }
    }

    // ========== RENDER ==========
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if (id === 'library') renderLibrary();
    }

    function renderLibrary() {
      const list = document.getElementById('libList');
      const filtered = APP.books.filter(b => 
        APP.currentTab === 'reading' ? !b.finished : b.finished
      );

      if (!filtered.length) {
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <p>${APP.currentTab === 'reading' ? '읽고 있는 책이 없습니다' : '다 읽은 책이 없습니다'}</p>
            <p style="font-size:13px;margin-top:8px;opacity:0.7">파일을 열어 서재에 추가하세요</p>
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(b => `
        <div class="book-card" data-id="${b.id}">
          <div class="book-cover">📖</div>
          <div class="book-info">
            <div class="book-title">${escapeHtml(b.title)}</div>
            <div class="book-meta">${formatDate(b.lastRead)} · ${Math.round(b.progress * 100)}%</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${b.progress * 100}%"></div></div>
          </div>
          <button class="book-delete" data-delete="${b.id}" title="삭제">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      `).join('');

      // events
      list.querySelectorAll('.book-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.book-delete')) return;
          openBook(card.dataset.id);
        });
      });
      list.querySelectorAll('.book-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('이 책을 서재에서 삭제할까요?')) {
            deleteBook(btn.dataset.delete);
          }
        });
      });
    }

    function openBook(id) {
      const book = APP.books.find(b => b.id === id);
      if (!book) return;
      APP.currentBookId = id;
      document.getElementById('readerTitle').textContent = book.title;
      
      // Ensure TOC ids exist in content
      let content = book.content;
      if (book.toc && book.toc.length) {
        // Make sure headings have matching ids where possible
        const parser = new DOMParser();
        const doc = parser.parseFromString('<div id="c">' + content + '</div>', 'text/html');
        const root = doc.getElementById('c');
        book.toc.forEach((t, i) => {
          if (!root.querySelector('#' + CSS.escape(t.id))) {
            // try find by text
            const headings = root.querySelectorAll('h1,h2,h3,.epub-chapter');
            if (headings[i]) headings[i].id = t.id;
          }
        });
        content = root.innerHTML;
      }

      document.getElementById('contentInner').innerHTML = content;
      document.getElementById('contentInner').classList.toggle('serif', APP.settings.font === 'serif');

      // restore scroll
      const scroller = document.getElementById('readerContent');
      setTimeout(() => {
        scroller.scrollTop = book.scrollTop || 0;
      }, 50);

      showScreen('reader');
      renderToc(book);
    }

    function renderToc(book) {
      const list = document.getElementById('tocList');
      if (!book.toc || !book.toc.length) {
        list.innerHTML = '<li class="toc-item">목차가 없습니다</li>';
        return;
      }
      list.innerHTML = book.toc.map(t => `
        <li class="toc-item" data-id="${t.id}" style="padding-left:${12 + (t.level-1)*16}px">${escapeHtml(t.title)}</li>
      `).join('');

      list.querySelectorAll('.toc-item').forEach(item => {
        item.addEventListener('click', () => {
          const el = document.getElementById(item.dataset.id);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          closeOverlay('tocOverlay');
        });
      });
    }

    // ========== SCROLL & TOOLBAR AUTO-HIDE ==========
    function setupScrollHide() {
      const scroller = document.getElementById('readerContent');
      let lastY = 0;
      let ticking = false;

      scroller.addEventListener('scroll', () => {
        if (!ticking) {
          requestAnimationFrame(() => {
            const y = scroller.scrollTop;
            const toolbar = document.getElementById('readerToolbar');
            const bottom = document.getElementById('readerBottom');

            if (y > lastY + 8 && y > 60) {
              // scrolling down -> hide
              toolbar.classList.add('hidden');
              bottom.classList.add('hidden');
              APP.toolbarVisible = false;
            } else if (y < lastY - 4) {
              // scrolling up -> show
              toolbar.classList.remove('hidden');
              bottom.classList.remove('hidden');
              APP.toolbarVisible = true;
            }
            lastY = y;

            // save progress
            if (APP.currentBookId) {
              const max = scroller.scrollHeight - scroller.clientHeight;
              const prog = max > 0 ? Math.min(1, y / max) : 0;
              updateBookProgress(APP.currentBookId, y, prog);
            }
            ticking = false;
          });
          ticking = true;
        }
      }, { passive: true });
    }

    // ========== TTS (System) ==========
    function populateVoices() {
      const select = document.getElementById('voiceSelect');
      const voices = speechSynthesis.getVoices();
      select.innerHTML = '';
      // Prefer Korean
      const sorted = [...voices].sort((a, b) => {
        const aKo = a.lang.startsWith('ko') ? 0 : 1;
        const bKo = b.lang.startsWith('ko') ? 0 : 1;
        return aKo - bKo;
      });
      sorted.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        select.appendChild(opt);
      });
      if (!voices.length) {
        select.innerHTML = '<option>사용 가능한 음성 없음</option>';
      }
    }

    function startTTS() {
      if (APP.isSpeaking) {
        speechSynthesis.cancel();
        APP.isSpeaking = false;
        document.getElementById('ttsStatus').textContent = '정지됨';
        return;
      }
      const content = document.getElementById('contentInner');
      const text = content.innerText || content.textContent;
      if (!text.trim()) {
        showToast('읽을 내용이 없습니다');
        return;
      }

      const utter = new SpeechSynthesisUtterance(text.slice(0, 15000)); // limit
      const voiceName = document.getElementById('voiceSelect').value;
      const voices = speechSynthesis.getVoices();
      const voice = voices.find(v => v.name === voiceName);
      if (voice) utter.voice = voice;
      utter.rate = parseFloat(document.getElementById('ttsRate').value) || 1;
      utter.lang = voice ? voice.lang : 'ko-KR';

      utter.onend = () => {
        APP.isSpeaking = false;
        document.getElementById('ttsStatus').textContent = '완료';
      };
      utter.onerror = () => {
        APP.isSpeaking = false;
        document.getElementById('ttsStatus').textContent = '오류 발생';
      };

      speechSynthesis.speak(utter);
      APP.ttsUtterance = utter;
      APP.isSpeaking = true;
      document.getElementById('ttsStatus').textContent = '읽는 중...';
    }

    // ========== EVENT BINDINGS ==========
    function bindEvents() {
      // Home
      document.getElementById('btnLibrary').addEventListener('click', () => showScreen('library'));
      document.getElementById('btnPaste').addEventListener('click', () => {
        document.getElementById('pasteOverlay').classList.add('active');
      });
      document.getElementById('btnOpenFile').addEventListener('click', () => {
        document.getElementById('fileInput').click();
      });

      // Library
      document.getElementById('btnLibBack').addEventListener('click', () => showScreen('home'));
      document.getElementById('btnLibAdd').addEventListener('click', () => {
        document.getElementById('fileInput').click();
      });
      document.querySelectorAll('.lib-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.lib-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          APP.currentTab = tab.dataset.tab;
          renderLibrary();
        });
      });

      // Reader
      document.getElementById('btnReaderBack').addEventListener('click', () => {
        speechSynthesis.cancel();
        APP.isSpeaking = false;
        showScreen('library');
      });
      document.getElementById('btnToc').addEventListener('click', () => {
        document.getElementById('tocOverlay').classList.add('active');
      });
      document.getElementById('btnSettings').addEventListener('click', () => {
        document.getElementById('settingsOverlay').classList.add('active');
      });
      document.getElementById('btnTTS').addEventListener('click', () => {
        populateVoices();
        document.getElementById('ttsOverlay').classList.add('active');
      });
      document.getElementById('btnNight').addEventListener('click', () => {
        APP.settings.night = !APP.settings.night;
        DB.saveSettings();
      });
      document.getElementById('btnMarkFinished').addEventListener('click', () => {
        if (APP.currentBookId) {
          markFinished(APP.currentBookId);
          showScreen('library');
        }
      });

      // Overlays close
      document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => {
          closeOverlay(btn.dataset.close);
        });
      });
      document.querySelectorAll('.overlay').forEach(ov => {
        ov.addEventListener('click', (e) => {
          if (e.target === ov) ov.classList.remove('active');
        });
      });

      // Settings
      document.querySelectorAll('.font-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          APP.settings.font = btn.dataset.font;
          DB.saveSettings();
        });
      });
      document.getElementById('fontSizeSlider').addEventListener('input', (e) => {
        APP.settings.fontSize = parseInt(e.target.value);
        document.getElementById('fontSizeVal').textContent = e.target.value;
        DB.saveSettings();
      });
      document.getElementById('letterSpacingSlider').addEventListener('input', (e) => {
        APP.settings.letterSpacing = parseInt(e.target.value);
        document.getElementById('letterSpacingVal').textContent = e.target.value;
        DB.saveSettings();
      });
      document.getElementById('lineHeightSlider').addEventListener('input', (e) => {
        APP.settings.lineHeight = parseInt(e.target.value) / 100;
        document.getElementById('lineHeightVal').textContent = APP.settings.lineHeight.toFixed(2);
        DB.saveSettings();
      });
      document.getElementById('nightToggle').addEventListener('click', () => {
        APP.settings.night = !APP.settings.night;
        DB.saveSettings();
      });

      // Paste
      document.getElementById('btnPasteConfirm').addEventListener('click', () => {
        const text = document.getElementById('pasteText').value.trim();
        if (!text) {
          showToast('텍스트를 입력하세요');
          return;
        }
        const title = document.getElementById('pasteTitle').value.trim() || '붙여넣은 텍스트';
        const built = buildContentAndToc(text, true);
        const book = addBook({ title, content: built.content, toc: built.toc, type: 'txt' });
        closeOverlay('pasteOverlay');
        document.getElementById('pasteText').value = '';
        document.getElementById('pasteTitle').value = '';
        openBook(book.id);
      });

      // File
      document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        showLoading(true);
        try {
          const data = await parseFile(file);
          const book = addBook(data);
          showLoading(false);
          openBook(book.id);
          showToast(`"${book.title}" 추가됨`);
        } catch (err) {
          console.error(err);
          showLoading(false);
          showToast('파일을 열 수 없습니다: ' + (err.message || '오류'));
        }
        e.target.value = '';
      });

      // TTS
      document.getElementById('btnTTSPlay').addEventListener('click', startTTS);
      document.getElementById('btnTTSStop').addEventListener('click', () => {
        speechSynthesis.cancel();
        APP.isSpeaking = false;
        document.getElementById('ttsStatus').textContent = '정지됨';
      });
      document.getElementById('ttsRate').addEventListener('input', (e) => {
        document.getElementById('ttsRateVal').textContent = parseFloat(e.target.value).toFixed(1);
      });

      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoices;
      }
    }

    function closeOverlay(id) {
      document.getElementById(id).classList.remove('active');
    }

    // ========== PWA SERVICE WORKER ==========
    function registerSW() {
      if (!('serviceWorker' in navigator)) return;
      const swCode = `
        const CACHE = 'lumina-v1';
        const ASSETS = ['./', './index.html'];
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));
        });
        self.addEventListener('activate', e => {
          e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(
            caches.match(e.request).then(r => r || fetch(e.request).then(res => {
              if (e.request.url.startsWith('http') && res.ok) {
                const clone = res.clone();
                caches.open(CACHE).then(c => c.put(e.request, clone));
              }
              return res;
            }).catch(() => caches.match('./index.html')))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(err => console.log('SW reg failed', err));
    }

    // ========== INIT ==========
    DB.load();
    bindEvents();
    setupScrollHide();
    registerSW();
    // Initial theme
    DB.applySettings();
  </script>
</body>
