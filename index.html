      --line-height: 1.85;
      --letter-spacing: 0.01em;
      --max-width: 680px;
      /* iOS 구버전 constant + 최신 env, 노치/홈인디케이터 */
      --safe-top: 0px;
      --safe-top: constant(safe-area-inset-top);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: 0px;
      --safe-bottom: constant(safe-area-inset-bottom);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --chrome-top: 44px;
      --chrome-bottom: 48px;
    }

    [data-theme="night"] {
      --bg: #0f0f12;
      --bg-secondary: #1a1a1f;
      --text: #e8e6e3;
      --text-secondary: #a0a0a8;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.15);
      --border: rgba(255,255,255,0.08);
      --card: #18181c;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
      /* iOS 바운스/주소창으로 레이아웃 밀림 방지 */
      position: fixed;
      inset: 0;
      width: 100%;
    }

    /* ===== Screens ===== */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .screen.active {
      display: flex;
    }

    /* ===== HOME ===== */
    #home {
      background: #f7f4ef;
      justify-content: flex-start;
      align-items: center;
      padding: calc(48px + var(--safe-top)) 28px calc(32px + var(--safe-bottom));
      text-align: center;
      overflow-y: auto;
      position: relative;
    }
    [data-theme="night"] #home {
      background: #141210;
    }

    .home-art {
      width: min(280px, 72vw);
      height: auto;
      margin: 12px auto 8px;
      display: block;
      filter: drop-shadow(0 20px 40px rgba(90, 70, 50, 0.12));
      animation: float 5s ease-in-out infinite;
    }
    [data-theme="night"] .home-art {
      filter: drop-shadow(0 16px 32px rgba(0,0,0,0.45)) brightness(0.92);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .app-name {
      font-family: var(--font-serif);
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin: 8px 0 6px;
      color: #2c241c;
    }
    [data-theme="night"] .app-name {
      color: #f0e6d8;
    }

    .app-tagline {
      font-size: 14px;
      color: #8a7f72;
      margin-bottom: 36px;
      letter-spacing: 0.18em;
      font-weight: 500;
    }
    [data-theme="night"] .app-tagline {
      color: #9a9086;
    }

    .home-actions {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: stretch;
      gap: 10px;
      width: 100%;
      max-width: 300px;
      box-sizing: border-box;
    }

    .home-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1 1 0;
      min-width: 0;
      max-width: 92px;
      height: 88px;
      padding: 10px 4px;
      border-radius: 18px;
      border: 1px solid rgba(60, 48, 36, 0.08);
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.22s ease;
      background: rgba(255, 252, 248, 0.92);
      color: #3d342a;
      box-shadow: 0 6px 20px rgba(60, 40, 20, 0.06);
      backdrop-filter: blur(8px);
      box-sizing: border-box;
    }
    [data-theme="night"] .home-btn {
      background: rgba(36, 32, 28, 0.9);
      color: #e8dfd4;
      border-color: rgba(255,255,255,0.06);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .home-btn:active {
      transform: scale(0.94);
    }
    .home-btn.primary {
      background: linear-gradient(160deg, #5c4a3a 0%, #3d3228 100%);
      color: #f5efe6;
      border: none;
      box-shadow: 0 10px 28px rgba(60, 45, 30, 0.28);
    }
    [data-theme="night"] .home-btn.primary {
      background: linear-gradient(160deg, #c4a882 0%, #a08060 100%);
      color: #1a1410;
      box-shadow: 0 10px 28px rgba(180, 140, 90, 0.25);
    }
    .home-btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .privacy-note {
      margin-top: 40px;
      font-size: 11px;
      color: #a3988c;
      opacity: 0.85;
      max-width: 260px;
      line-height: 1.65;
      letter-spacing: 0.02em;
    }
    [data-theme="night"] .privacy-note {
      color: #7a726a;
    }

    /* ===== LIBRARY ===== */
    #library {
      background: #f6f2eb;
      position: relative;
    }
    [data-theme="night"] #library {
      background: #12100e;
    }

    .lib-bg-art {
      position: absolute;
      right: -20px;
      bottom: 8%;
      width: min(220px, 55vw);
      opacity: 0.14;
      pointer-events: none;
      z-index: 0;
    }
    [data-theme="night"] .lib-bg-art {
      opacity: 0.1;
    }

    .lib-header {
      padding: calc(16px + var(--safe-top)) 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(60, 48, 36, 0.08);
      background: transparent;
      z-index: 10;
      position: relative;
    }
    [data-theme="night"] .lib-header {
      border-bottom-color: rgba(255,255,255,0.06);
    }

    .lib-title {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #2c241c;
    }
    [data-theme="night"] .lib-title {
      color: #f0e6d8;
    }

    .lib-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: rgba(255,252,248,0.8);
      color: #3d342a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    [data-theme="night"] .icon-btn {
      background: rgba(40,36,32,0.85);
      color: #e8dfd4;
    }
    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(92, 74, 58, 0.15);
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .lib-tabs {
      display: flex;
      padding: 14px 20px 0;
      gap: 8px;
      position: relative;
      z-index: 2;
    }

    .lib-tab {
      flex: 1;
      padding: 11px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: #8a7f72;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .lib-tab.active {
      background: rgba(92, 74, 58, 0.12);
      color: #5c4a3a;
    }
    [data-theme="night"] .lib-tab {
      color: #9a9086;
    }
    [data-theme="night"] .lib-tab.active {
      background: rgba(196, 168, 130, 0.15);
      color: #c4a882;
    }

    .lib-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px calc(24px + var(--safe-bottom));
      -webkit-overflow-scrolling: touch;
      position: relative;
      z-index: 2;
    }

    .book-card {
      background: rgba(255, 252, 248, 0.94);
      border-radius: 16px;
      padding: 16px 16px 16px 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 18px rgba(60, 40, 20, 0.06);
      border: 1px solid rgba(60, 48, 36, 0.07);
      display: flex;
      gap: 14px;
      align-items: flex-start;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    [data-theme="night"] .book-card {
      background: rgba(28, 26, 24, 0.92);
      border-color: rgba(255,255,255,0.06);
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    }
    .book-card:active {
      transform: scale(0.985);
    }

    .book-cover {
      width: 48px;
      height: 66px;
      border-radius: 8px;
      background: linear-gradient(160deg, #e8dcc8, #c4a882);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 20px;
      color: #5c4a3a;
      box-shadow: inset 0 0 0 1px rgba(60,40,20,0.08);
    }
    [data-theme="night"] .book-cover {
      background: linear-gradient(160deg, #3d3428, #2a241c);
      color: #c4a882;
    }

    .book-info {
      flex: 1;
      min-width: 0;
      padding-right: 28px;
    }

    .book-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: anywhere;
      line-height: 1.45;
      color: #2c241c;
    }
    [data-theme="night"] .book-title {
      color: #f0e6d8;
    }

    .book-meta {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 4px;
      background: var(--bg-secondary);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #c4a882, #5c4a3a);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .book-delete {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.6;
      transition: all 0.2s;
    }
    .book-delete:hover, .book-delete:active {
      opacity: 1;
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
    }
    .book-delete svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .empty-state svg {
      width: 64px;
      height: 64px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      opacity: 0.4;
      margin-bottom: 16px;
    }

    /* ===== READER ===== */
    #reader {
      background: var(--bg);
    }

    .reader-toolbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding-top: calc(var(--safe-top) + 8px);
      padding-bottom: 8px;
      padding-left: 8px;
      padding-right: 8px;
      min-height: calc(var(--safe-top) + var(--chrome-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(250, 247, 242, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(60, 48, 36, 0.08);
      z-index: 50;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
      transform: translateY(0);
      opacity: 1;
      box-sizing: border-box;
    }
    [data-theme="night"] .reader-toolbar {
      background: rgba(18, 16, 14, 0.96);
      border-bottom-color: rgba(255,255,255,0.06);
    }
    .reader-toolbar.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .reader-toolbar .icon-btn {
      background: transparent;
    }

    .reader-title {
      font-size: 14px;
      font-weight: 600;
      max-width: 50%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .reader-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      /* 노치 + 상단바 / 홈인디케이터 + 하단바 만큼만 확보 */
      padding-top: calc(var(--safe-top) + var(--chrome-top) + 4px);
      padding-bottom: calc(var(--safe-bottom) + var(--chrome-bottom) + 4px);
      padding-left: 20px;
      padding-right: 20px;
      scroll-behavior: smooth;
      background: #faf7f2;
      transition: padding 0.25s ease;
    }
    /* 메뉴 숨김 시 노치/홈인디케이터만 남기고 본문 확장 */
    #reader.chrome-hidden .reader-content {
      padding-top: calc(var(--safe-top) + 12px);
      padding-bottom: calc(var(--safe-bottom) + 12px);
    }
    [data-theme="night"] .reader-content {
      background: #12100e;
    }

    .reader-content.serif .content-inner,
    .content-inner.serif {
      font-family: var(--font-serif);
    }

    .content-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      font-size: var(--font-size);
      line-height: var(--line-height);
      letter-spacing: var(--letter-spacing);
      color: #2c241c;
      font-family: var(--font-reading);
    }
    [data-theme="night"] .content-inner {
      color: #e8dfd4;
    }
    .content-inner.serif,
    .content-inner.serif p,
    .content-inner.serif blockquote {
      font-family: var(--font-serif) !important;
    }

    /* 묵향 본문 타이포 */
    .content-inner h1 {
      font-family: var(--font-serif);
      font-size: 1.65em;
      font-weight: 700;
      margin: 2.2em 0 1em;
      letter-spacing: 0.04em;
      line-height: 1.35;
      color: #2c241c;
      text-align: center;
      border: none;
      padding: 0 0 0.6em;
      display: block;
    }
    .content-inner h1::after {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: #c4a882;
      margin: 0.7em auto 0;
      opacity: 0.7;
    }
    [data-theme="night"] .content-inner h1 {
      color: #f0e6d8;
    }

    .content-inner h2 {
      font-family: var(--font-serif);
      font-size: 1.28em;
      font-weight: 700;
      margin: 2.4em 0 1em;
      letter-spacing: 0.06em;
      line-height: 1.4;
      color: #5c4a3a;
      text-align: center;
      display: block;
      clear: both;
    }
    [data-theme="night"] .content-inner h2 {
      color: #c4a882;
    }

    .content-inner h3 {
      font-family: var(--font-serif);
      font-size: 1.12em;
      font-weight: 600;
      margin: 1.8em 0 0.8em;
      color: #3d342a;
      display: block;
    }
    [data-theme="night"] .content-inner h3 {
      color: #d4c4b0;
    }

    .content-inner p {
      margin: 0 0 1.15em;
      text-align: justify;
      word-break: keep-all;
      overflow-wrap: break-word;
      display: block;
    }

    /* 대사 전용 — 과하지 않은 강조 */
    .content-inner blockquote.dialogue {
      margin: 1.1em 0 1.1em 0.4em;
      padding: 0.15em 0 0.15em 0.9em;
      background: transparent;
      border-left: 2px solid rgba(92, 74, 58, 0.35);
      border-radius: 0;
      font-style: normal;
      color: #3d342a;
    }
    [data-theme="night"] .content-inner blockquote.dialogue {
      border-left-color: rgba(196, 168, 130, 0.4);
      color: #e0d5c8;
    }
    .content-inner blockquote.dialogue p {
      margin: 0;
    }

    /* 일반 blockquote는 스타일 최소화 (오적용 방지) */
    .content-inner blockquote:not(.dialogue) {
      margin: 1em 0;
      padding: 0;
      background: transparent;
      border: none;
      font-style: normal;
    }

    .content-inner hr {
      border: none;
      height: 1px;
      background: rgba(92, 74, 58, 0.15);
      margin: 2.5em auto;
      width: 40%;
    }

    .chapter-marker {
      text-align: center;
      margin: 2.5em 0 1.5em;
      font-size: 0.85em;
      color: #8a7f72;
      letter-spacing: 0.12em;
    }

    /* Bottom bar (auto-hide) — 슬림 + 홈 인디케이터 대응 */
    .reader-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding-top: 6px;
      padding-bottom: calc(var(--safe-bottom) + 6px);
      padding-left: 8px;
      padding-right: 8px;
      min-height: calc(var(--safe-bottom) + var(--chrome-bottom));
      background: rgba(250, 247, 242, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(60, 48, 36, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
      transform: translateY(0);
      opacity: 1;
      box-sizing: border-box;
    }
    [data-theme="night"] .reader-bottom {
      background: rgba(18, 16, 14, 0.96);
      border-top-color: rgba(255,255,255,0.06);
    }
    .reader-bottom.hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    .bottom-btn {
      width: 44px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0;
      color: var(--text-secondary);
    }
    .bottom-btn:active {
      background: rgba(92, 74, 58, 0.1);
      color: #5c4a3a;
    }
    .bottom-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }
    .bottom-btn.active {
      color: #5c4a3a;
    }

    /* ===== MODALS / PANELS ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.active {
      display: flex;
    }

    .panel {
      background: var(--card);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px 20px calc(24px + var(--safe-bottom));
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
    }

    .panel-close {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: var(--bg-secondary);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .panel-close svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* Settings */
    .setting-group {
      margin-bottom: 24px;
    }
    .setting-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .font-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .font-opt {
      flex: 1;
      min-width: 80px;
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      font-family: inherit;
      color: var(--text);
    }
    .font-opt.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .font-opt.serif {
      font-family: var(--font-serif);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--bg-secondary);
      outline: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .slider-value {
      font-size: 14px;
      font-weight: 600;
      min-width: 40px;
      text-align: right;
      color: var(--accent);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }
    .toggle {
      width: 50px;
      height: 30px;
      border-radius: 15px;
      background: var(--bg-secondary);
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.on {
      background: var(--accent);
    }
    .toggle::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: white;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .toggle.on::after {
      transform: translateX(20px);
    }

    /* TOC */
    .toc-list {
      list-style: none;
    }
    .toc-item {
      padding: 14px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .toc-item:active, .toc-item:hover {
      background: var(--accent-soft);
    }
    .toc-item.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* Paste modal */
    .paste-area {
      width: 100%;
      min-height: 180px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      font-size: 15px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      resize: vertical;
      outline: none;
    }
    .paste-area:focus {
      border-color: var(--accent);
    }

    .panel-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      color: white;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 16px;
    }
    .panel-btn:active {
      opacity: 0.9;
    }

    /* TTS controls */
    .tts-status {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 8px;
    }

    /* Loading */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .loading-overlay.active {
      display: flex;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Hidden file input */
    #fileInput {
      display: none;
    }

    /* Progress toast */
    .toast {
      position: fixed;
      bottom: calc(64px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--card);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      opacity: 0;
      transition: all 0.3s;
      z-index: 150;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

  <!-- External libs (CDN, cached by SW when possible) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

  <script>
    // ========== CONFIG & STATE ==========
    const APP = {
      books: [],
      currentBookId: null,
      currentTab: 'reading',
      settings: {
        font: 'sans',
        fontSize: 18,
        letterSpacing: 1,
        lineHeight: 1.85,
        night: false
      },
      lastScrollY: 0,
      toolbarVisible: true,
      ttsUtterance: null,
      isSpeaking: false
    };

    // ========== STORAGE ==========
    const DB = {
      KEY: 'lumina_books_v1',
      SETTINGS: 'lumina_settings_v1',

      load() {
        try {
          const raw = localStorage.getItem(this.KEY);
          APP.books = raw ? JSON.parse(raw) : [];
        } catch (e) {
          APP.books = [];
        }
        try {
          const s = localStorage.getItem(this.SETTINGS);
          if (s) Object.assign(APP.settings, JSON.parse(s));
        } catch (e) {}
        this.applySettings();
      },

      save() {
        localStorage.setItem(this.KEY, JSON.stringify(APP.books));
      },

      saveSettings() {
        localStorage.setItem(this.SETTINGS, JSON.stringify(APP.settings));
        this.applySettings();
      },

      applySettings() {
        const root = document.documentElement;
        const isSerif = APP.settings.font === 'serif';
        root.style.setProperty('--font-size', APP.settings.fontSize + 'px');
        root.style.setProperty('--letter-spacing', (APP.settings.letterSpacing / 100) + 'em');
        root.style.setProperty('--line-height', String(APP.settings.lineHeight));
        root.style.setProperty('--font-reading', isSerif
          ? getComputedStyle(root).getPropertyValue('--font-serif').trim() || '"Nanum Myeongjo", "Apple Myungjo", serif'
          : getComputedStyle(root).getPropertyValue('--font-body').trim() || '"Noto Sans KR", sans-serif');
        // 직접 스택 지정 (getComputedStyle이 빈 경우 대비)
        if (isSerif) {
          root.style.setProperty('--font-reading', '"Nanum Myeongjo", "Apple Myungjo", "Noto Serif KR", "Batang", serif');
        } else {
          root.style.setProperty('--font-reading', '"Noto Sans KR", "Apple SD Gothic Neo", sans-serif');
        }
        document.body.dataset.theme = APP.settings.night ? 'night' : '';
        const content = document.getElementById('contentInner');
        if (content) {
          content.classList.toggle('serif', isSerif);
          content.style.fontFamily = isSerif
            ? '"Nanum Myeongjo", "Apple Myungjo", "Batang", serif'
            : '"Noto Sans KR", "Apple SD Gothic Neo", sans-serif';
          content.style.fontSize = APP.settings.fontSize + 'px';
          content.style.lineHeight = String(APP.settings.lineHeight);
          content.style.letterSpacing = (APP.settings.letterSpacing / 100) + 'em';
        }
        // UI sync
        const fs = document.getElementById('fontSizeSlider');
        const fsv = document.getElementById('fontSizeVal');
        const ls = document.getElementById('letterSpacingSlider');
        const lsv = document.getElementById('letterSpacingVal');
        const lh = document.getElementById('lineHeightSlider');
        const lhv = document.getElementById('lineHeightVal');
        const nt = document.getElementById('nightToggle');
        if (fs) fs.value = APP.settings.fontSize;
        if (fsv) fsv.textContent = APP.settings.fontSize;
        if (ls) ls.value = APP.settings.letterSpacing;
        if (lsv) lsv.textContent = APP.settings.letterSpacing;
        if (lh) lh.value = Math.round(APP.settings.lineHeight * 100);
        if (lhv) lhv.textContent = Number(APP.settings.lineHeight).toFixed(2);
        if (nt) nt.classList.toggle('on', !!APP.settings.night);
        document.querySelectorAll('.font-opt').forEach(el => {
          el.classList.toggle('active', el.dataset.font === APP.settings.font);
        });
      }
    };

    // ========== UTILITIES ==========
    function showToast(msg, ms = 2200) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('active', show);
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function formatDate(ts) {
      const d = new Date(ts);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    // Encoding detection & decode for Korean
    async function decodeText(buffer) {
      // Try UTF-8 first
      try {
        const dec = new TextDecoder('utf-8', { fatal: true });
        return dec.decode(buffer);
      } catch (e) {}
      // Try EUC-KR / CP949
      try {
        const dec = new TextDecoder('euc-kr');
        return dec.decode(buffer);
      } catch (e) {}
      // Fallback UTF-8 non-fatal
      return new TextDecoder('utf-8').decode(buffer);
    }

    // ========== FILE PARSERS ==========
    async function parseFile(file) {
      const name = file.name;
      const ext = name.split('.').pop().toLowerCase();
      const buffer = await file.arrayBuffer();

      let title = name.replace(/\.[^.]+$/, '');
      let content = '';
      let toc = [];

      if (ext === 'txt' || ext === 'md') {
        let raw = await decodeText(buffer);
        if (ext === 'md' && typeof marked !== 'undefined') {
          const built = buildContentAndToc(marked.parse(raw), false);
          content = built.content;
          toc = built.toc;
        } else {
          const built = buildContentAndToc(raw, true);
          content = built.content;
          toc = built.toc;
        }
      }
      else if (ext === 'html' || ext === 'htm') {
        let raw = await decodeText(buffer);
        raw = raw.replace(/<script[\s\S]*?<\/script>/gi, '')
                 .replace(/<style[\s\S]*?<\/style>/gi, '');
        const built = buildContentAndToc(raw, false);
        content = built.content;
        toc = built.toc;
      }
      else if (ext === 'docx' && typeof mammoth !== 'undefined') {
        const result = await mammoth.convertToHtml({ arrayBuffer: buffer });
        const built = buildContentAndToc(result.value, false);
        content = built.content;
        toc = built.toc;
      }
      else if (ext === 'pdf' && typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        let pages = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          pages.push(extractPdfPageText(textContent));
        }
        // PDF도 챕터 패턴 감지 시도 후, 부족하면 페이지 단위 목차
        const built = buildContentAndToc(pages.join('\n\n'), true);
        content = built.content;
        if (built.toc && built.toc.length >= 2 && !built.toc[0].id.startsWith('arb-') && built.toc[0].title !== '본문') {
          toc = built.toc;
        } else {
          // 페이지 기반 목차 + id 주입
          const parser = new DOMParser();
          const doc = parser.parseFromString('<div id="root">' + content + '</div>', 'text/html');
          const root = doc.getElementById('root');
          const children = Array.from(root.children);
          toc = [];
          const step = Math.max(1, Math.ceil(children.length / Math.min(pages.length, 30)));
          for (let i = 0, p = 0; i < children.length && p < pages.length; i += step, p++) {
            const id = 'pdf-page-' + (p + 1);
            if (children[i]) children[i].id = id;
            toc.push({ id, title: `페이지 ${p + 1}`, level: 1 });
          }
          content = root.innerHTML;
        }
      }
      else if (ext === 'epub' && typeof JSZip !== 'undefined') {
        const zip = await JSZip.loadAsync(buffer);
        // Find OPF
        let opfPath = null;
        const container = await zip.file('META-INF/container.xml')?.async('string');
        if (container) {
          const match = container.match(/full-path=["']([^"']+)["']/);
          if (match) opfPath = match[1];
        }
        if (!opfPath) {
          // fallback search
          for (const path of Object.keys(zip.files)) {
            if (path.endsWith('.opf')) { opfPath = path; break; }
          }
        }
        if (!opfPath) throw new Error('EPUB 구조를 찾을 수 없습니다.');

        const opfDir = opfPath.substring(0, opfPath.lastIndexOf('/') + 1);
        const opfText = await zip.file(opfPath).async('string');
        const parser = new DOMParser();
        const opfDoc = parser.parseFromString(opfText, 'application/xml');

        // Title
        const titleEl = opfDoc.querySelector('metadata > title, dc\\:title, title');
        if (titleEl) title = titleEl.textContent.trim() || title;

        // Spine
        const manifest = {};
        opfDoc.querySelectorAll('manifest > item, item').forEach(item => {
          const id = item.getAttribute('id');
          const href = item.getAttribute('href');
          if (id && href) manifest[id] = opfDir + href;
        });

        const spine = [];
        opfDoc.querySelectorAll('spine > itemref, itemref').forEach(ref => {
          const idref = ref.getAttribute('idref');
          if (manifest[idref]) spine.push(manifest[idref]);
        });

        // TOC (NCX or NAV)
        let ncxPath = null;
        opfDoc.querySelectorAll('manifest > item, item').forEach(item => {
          if (item.getAttribute('media-type') === 'application/x-dtbncx+xml') {
            ncxPath = opfDir + item.getAttribute('href');
          }
        });
        if (ncxPath && zip.file(ncxPath)) {
          const ncxText = await zip.file(ncxPath).async('string');
          const ncxDoc = parser.parseFromString(ncxText, 'application/xml');
          ncxDoc.querySelectorAll('navPoint').forEach((np, idx) => {
            const label = np.querySelector('navLabel > text, text')?.textContent?.trim();
            if (label) toc.push({ id: 'epub-ch-' + idx, title: label, level: 1 });
          });
        }

        // Extract content
        let htmlParts = [];
        for (let i = 0; i < spine.length; i++) {
          const path = spine[i];
          const file = zip.file(path);
          if (!file) continue;
          let chapterHtml = await file.async('string');
          // Basic cleanup
          chapterHtml = chapterHtml.replace(/<script[\s\S]*?<\/script>/gi, '')
                                   .replace(/<style[\s\S]*?<\/style>/gi, '')
                                   .replace(/<link[^>]*>/gi, '');
          // Relative images ignored for simplicity
          htmlParts.push(`<div class="epub-chapter" id="epub-ch-${i}">${chapterHtml}</div>`);
          if (!toc.length) {
            // try extract heading
            const tmp = parser.parseFromString(chapterHtml, 'text/html');
            const h = tmp.querySelector('h1, h2, title');
            toc.push({
              id: 'epub-ch-' + i,
              title: h ? h.textContent.trim().slice(0, 60) : `챕터 ${i + 1}`,
              level: 1
            });
          }
        }
        content = htmlParts.join('\n');
        if (!toc.length) {
          const built = buildContentAndToc(content, false);
          content = built.content;
          toc = built.toc;
        } else {
          // NCX 목차가 있어도 본문 안 챕터 승격 + 대화 강조
          content = promoteChapterParagraphs(content);
          content = enhanceDialogue(content);
        }
      }
      else {
        // fallback as text
        const built = buildContentAndToc(await decodeText(buffer), true);
        content = built.content;
        toc = built.toc;
      }

      return { title, content, toc, type: ext };
    }

    // ========== PDF 텍스트 추출 (좌표 기반 줄/단락 복원) ==========
    function extractPdfPageText(textContent) {
      const items = (textContent.items || []).filter(it => it.str && it.str.length);
      if (!items.length) return '';

      // transform: [scaleX, skewY, skewX, scaleY, translateX, translateY]
      const rows = items.map(it => {
        const t = it.transform || [1, 0, 0, 1, 0, 0];
        return {
          str: it.str,
          x: t[4],
          y: t[5],
          h: Math.abs(t[3]) || Math.abs(it.height) || 10
        };
      });

      // Y 내림차순(PDF 좌표계), 같으면 X 오름차순
      rows.sort((a, b) => {
        const dy = b.y - a.y;
        if (Math.abs(dy) > 2) return dy;
        return a.x - b.x;
      });

      const lines = [];
      let cur = [];
      let lastY = null;
      let lastH = 12;

      for (const r of rows) {
        if (lastY === null) {
          cur.push(r);
          lastY = r.y;
          lastH = r.h;
          continue;
        }
        const gap = Math.abs(lastY - r.y);
        // 같은 줄: 높이의 약 0.4배 이내
        if (gap < Math.max(2, lastH * 0.45)) {
          cur.push(r);
        } else {
          // 줄 완성
          cur.sort((a, b) => a.x - b.x);
          const lineText = cur.map(c => c.str).join('').replace(/\s+/g, ' ').trim();
          if (lineText) {
            lines.push({ text: lineText, y: lastY, gapFromPrev: gap, h: lastH });
          }
          cur = [r];
          lastY = r.y;
          lastH = r.h;
        }
      }
      if (cur.length) {
        cur.sort((a, b) => a.x - b.x);
        const lineText = cur.map(c => c.str).join('').replace(/\s+/g, ' ').trim();
        if (lineText) lines.push({ text: lineText, y: lastY, gapFromPrev: 0, h: lastH });
      }

      // 줄 간격이 크면 단락 구분
      let out = '';
      for (let i = 0; i < lines.length; i++) {
        const L = lines[i];
        if (i > 0) {
          const prev = lines[i - 1];
          const gap = Math.abs(prev.y - L.y);
          const avgH = (prev.h + L.h) / 2;
          if (gap > avgH * 1.6) out += '\n\n';
          else out += '\n';
        }
        out += L.text;
      }
      return out;
    }

    // ========== 한글 소설/문서 챕터 감지 ==========
    function isChapterLine(text) {
      if (!text) return false;
      const t = text.trim();
      if (t.length === 0 || t.length > 100) return false;

      if (/^제\s*[0-9０-９일이삼사오육륙칠팔구십백천만]+\s*[장화편부절막권회]/.test(t)) return true;
      if (/^제\s*\d+\s*[장화편부절막권회]/.test(t)) return true;
      if (/^[【\[\(〈《「『≪〈\<\-\*\★●◆■□▶▷※]*\s*\d+\s*[장화편부절막권회]/.test(t)) return true;
      if (/^\d+\s*[\.．、]\s*[장화편부절막권회]/.test(t)) return true;
      if (/^\d{1,3}\s*[\.．:：]\s*.{1,60}$/.test(t) && !/^\d+\s*[\.．:：]\s*\d+/.test(t)) return true;
      // 【】≪≫ 등만 챕터 — 「」『』는 한국어 대사용이라 제외
      if (/^[【\[〈《≪].{1,50}[】\]〉》≫]$/.test(t)) return true;
      if (/^[≪〈《].+[≫〉》]$/.test(t)) return true;
      if (/^(Chapter|CHAPTER|Ch\.?|Episode|EP\.?|Part|PART|Volume|Vol\.?|Act|Scene)\s*[\dIVXLCivxlc]+/i.test(t)) return true;
      if (/^(프롤로그|에필로그|서장|종장|서문|후기|발문|머리말|맺음말|서사|중간|막간|인터미션|보너스|외전|번외|특별편)(\s*\d+)?$/i.test(t)) return true;
      if (/^(첫\s*째|둘\s*째|셋\s*째|넷\s*째|다섯\s*째|여섯\s*째|일곱\s*째|여덟\s*째|아홉\s*째|열\s*째)\s*[마당장화편부]/.test(t)) return true;
      if (/^第\s*[0-9一二三四五六七八九十百千]+\s*[章話編部節幕卷回]/.test(t)) return true;
      if (/^\d{1,3}$/.test(t)) return true;
      if (/^[★☆●○◆◇■□▶▷※◎]/.test(t) && t.length < 50) return true;
      if (/^(에피소드|에피소우드|Episode|EP)\s*\.?\s*\d+/i.test(t)) return true;
      if (/^\d{1,3}\s+[가-힣A-Za-z].{0,40}$/.test(t) && t.length < 50) return true;

      return false;
    }

    // 본문 중간에 붙은 챕터 '표기 자체'만 추출 (뒤따르는 본문은 남김)
    const CHAPTER_INLINE_RE = /(?:^|[\n\s])(제\s*\d{1,4}\s*[장화편부절막권회]|제\s*[일이삼사오육륙칠팔구십백천만]+\s*[장화편부절막권회]|\d{1,3}\s*[장화편부절막권회]|Chapter\s*[\dIVXLCivxlc]+|CHAPTER\s*[\dIVXLCivxlc]+|Episode\s*\d+|EP\.?\s*\d+|Part\s*[\dIVXLCivxlc]+|프롤로그|에필로그|서장|종장|외전|번외|【[^】]{1,30}】|≪[^≫]{1,30}≫|〈[^〉]{1,30}〉)(?=[\n\s.。！？!?]|$)/gi;

    // 한 줄로 이어진 텍스트를 독서 가능한 형태로 복원
    function normalizeRawText(text) {
      if (!text) return '';
      let t = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      // 폼피드 → 페이지 구분
      t = t.replace(/\f/g, '\n\n');

      // 과도한 공백 정리 (단, 줄바꿈은 유지)
      t = t.replace(/[ \t]+/g, ' ');
      t = t.replace(/ *\n */g, '\n');

      // 줄바꿈이 거의 없는 긴 텍스트만 벽 텍스트로 재분할 (기존 단락 구조는 보존)
      const lines = t.split('\n').filter(l => l.trim());
      const totalLen = t.replace(/\s/g, '').length;
      const newlineCount = (t.match(/\n/g) || []).length;
      const avgLineLen = lines.length ? totalLen / lines.length : totalLen;
      const isWallText = totalLen > 400 && (newlineCount < 4 || avgLineLen > 180);

      // 챕터 표기 분리: 이미 짧은 챕터 전용 줄은 유지, 본문 중간에 끼어 있을 때만 분리
      t = t.split('\n').map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '';
        if (isChapterLine(trimmed) && trimmed.length <= 90) return trimmed;
        return trimmed.replace(CHAPTER_INLINE_RE, function(m, chap) {
          return '\n\n' + chap.trim() + '\n\n';
        });
      }).join('\n');

      if (isWallText) {
        // 문장 종결 뒤에서만 분리 (닫는 따옴표 단독 분리는 하지 않음 — 대사 구조 파괴 방지)
        t = t.replace(/([.!?。？！…])\s+(?=[“"「『([{【〈《가-힣A-Za-z0-9])/g, '$1\n\n');

        const rebuilt = [];
        t.split('\n').forEach(line => {
          const s = line.trim();
          if (!s) { rebuilt.push(''); return; }
          if (s.length <= 220) { rebuilt.push(s); return; }
          let rest = s;
          while (rest.length > 220) {
            let cut = -1;
            for (let i = 180; i < Math.min(260, rest.length); i++) {
              if (/[.!?。？！…\s]/.test(rest[i])) cut = i + 1;
            }
            if (cut < 0) cut = 220;
            rebuilt.push(rest.slice(0, cut).trim());
            rest = rest.slice(cut).trim();
          }
          if (rest) rebuilt.push(rest);
        });
        t = rebuilt.join('\n');
      }

      // 연속 빈 줄 정리 (최대 2개)
      t = t.replace(/\n{3,}/g, '\n\n');
      return t.trim();
    }

    function plainToHtml(text) {
      // 먼저 벽 텍스트 / 챕터 인라인 복원
      text = normalizeRawText(text);

      const lines = text.split('\n');
      let html = '';
      let para = [];
      let chapterCount = 0;

      const flushPara = () => {
        if (para.length) {
          const joined = para.join(' ').trim();
          if (joined) {
            // 단락 안이 여전히 너무 길면 문장 단위로 추가 분리
            if (joined.length > 400) {
              const sentences = splitIntoSentences(joined);
              sentences.forEach(s => {
                if (s.trim()) html += '<p>' + escapeHtml(s.trim()) + '</p>\n';
              });
            } else {
              html += '<p>' + escapeHtml(joined) + '</p>\n';
            }
          }
          para = [];
        }
      };

      for (let i = 0; i < lines.length; i++) {
        const trimmed = lines[i].trim();
        if (!trimmed) {
          flushPara();
          continue;
        }

        const prevEmpty = i === 0 || !lines[i - 1].trim();
        const nextEmpty = i === lines.length - 1 || !lines[i + 1].trim();
        const isShort = trimmed.length <= 90;
        const looksChapter = isChapterLine(trimmed);
        // 따옴표로 시작하는 줄은 대사 후보 → 단독 단락
        const looksDialogue = /^[“「『"'‘″]/.test(trimmed) || /^[\s…·]*[“「『"'‘]/.test(trimmed);

        if (isShort && looksChapter && (prevEmpty || nextEmpty || chapterCount > 0 || trimmed.length <= 40)) {
          flushPara();
          chapterCount++;
          const id = 'ch-' + chapterCount;
          html += `<h2 id="${id}">${escapeHtml(trimmed)}</h2>\n`;
        } else if (looksDialogue) {
          flushPara();
          html += '<p>' + escapeHtml(trimmed) + '</p>\n';
        } else {
          para.push(trimmed);
        }
      }
      flushPara();
      return html;
    }

    function splitIntoSentences(text) {
      // 문장 단위 분할 (한글 대응)
      const parts = text.split(/(?<=[.!?。？！…])\s+|(?<=[”」』"'])\s+(?=[“"「『가-힣A-Za-z])/);
      const result = [];
      let buf = '';
      for (const p of parts) {
        buf += (buf ? ' ' : '') + p;
        // 어느 정도 길이 모이면 단락으로
        if (buf.length >= 120 && /[.!?。？！…”」』"']$/.test(buf.trim())) {
          result.push(buf.trim());
          buf = '';
        }
      }
      if (buf.trim()) result.push(buf.trim());
      return result.length ? result : [text];
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // 대사 인용 스타일 — 한국어 소설 대사를 폭넓게 인식
    function isDialogueParagraph(text) {
      let t = text.trim()
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/&ldquo;|&rdquo;|&lsquo;|&rsquo;/g, '"')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&amp;/g, '&');
      if (!t || t.length < 2 || t.length > 600) return false;

      // 여는 따옴표로 시작 → 대사로 간주 (닫는 따옴표 없어도 OK)
      if (/^[“「『"'‘″]/.test(t)) {
        // 닫는 따옴표 뒤에 긴 서술만 붙은 경우만 제외
        // 예: "가자." 하고 그가 말했다.
        const m = t.match(/[”」』"'’″]([^”」』"'’″]*)$/);
        if (m) {
          const tail = m[1].trim();
          if (tail.length > 10 && /(라고|하고|며|하자|하고는|하면서|했다|한다|물었|말했|대답|외쳤|중얼|물었다|말했다)/.test(tail)) {
            return false;
          }
        }
        return true;
      }

      // 공백/말줄임 뒤 따옴표로 시작
      if (/^[\s…·\-\*—–]+[“「『"'‘]/.test(t) && /[”」』"'’]/.test(t)) return true;

      // 단락의 75% 이상이 따옴표 안 내용
      const chunks = t.match(/[“「『"'‘][^”」』"'’]{0,500}[”」』"'’]/g);
      if (chunks) {
        const qLen = chunks.join('').length;
        if (qLen / t.length >= 0.7 && t.length <= 450) return true;
      }

      return false;
    }

    function enhanceDialogue(html) {
      return html.replace(/<p>([^<]*)<\/p>/g, (m, text) => {
        if (isDialogueParagraph(text)) {
          return `<blockquote class="dialogue"><p>${text}</p></blockquote>`;
        }
        return m;
      });
    }

    // HTML 안에서도 챕터 승격 + 긴 단락 분할 (제목/챕터/본문 절대 한 줄 금지)
    function promoteChapterParagraphs(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString('<div id="root">' + html + '</div>', 'text/html');
      const root = doc.getElementById('root');
      let count = root.querySelectorAll('h1,h2,h3').length;

      // 1) 짧은 챕터성 <p> → <h2>
      Array.from(root.querySelectorAll('p')).forEach(p => {
        const text = (p.textContent || '').trim();
        if (text.length > 0 && text.length <= 90 && isChapterLine(text)) {
          const h = doc.createElement('h2');
          count++;
          h.id = 'ch-' + count;
          h.textContent = text;
          p.parentNode.replaceChild(h, p);
        }
      });

      // 2) 인라인 챕터 포함 단락은 길이와 무관하게 분리
      Array.from(root.querySelectorAll('p')).forEach(p => {
        const text = (p.textContent || '').trim();
        if (!text) return;

        const hasChapter = CHAPTER_INLINE_RE.test(text);
        CHAPTER_INLINE_RE.lastIndex = 0;
        if (!hasChapter && text.length < 280) return;

        let working = text;
        working = working.replace(CHAPTER_INLINE_RE, function(m, chap) {
          return '\n\n@@CHAPTER@@' + chap.trim() + '\n\n';
        });

        // 문장 단위 단락 분할
        const chunks = [];
        working.split(/\n\n+/).forEach(block => {
          block = block.trim();
          if (!block) return;
          if (block.startsWith('@@CHAPTER@@')) {
            chunks.push({ type: 'h2', text: block.replace('@@CHAPTER@@', '').trim() });
          } else if (block.length > 350) {
            splitIntoSentences(block).forEach(s => {
              if (s.trim()) chunks.push({ type: 'p', text: s.trim() });
            });
          } else {
            chunks.push({ type: 'p', text: block });
          }
        });

        if (chunks.length <= 1) return;

        const frag = doc.createDocumentFragment();
        chunks.forEach(c => {
          if (c.type === 'h2') {
            const h = doc.createElement('h2');
            count++;
            h.id = 'ch-' + count;
            h.textContent = c.text;
            frag.appendChild(h);
          } else {
            const np = doc.createElement('p');
            np.textContent = c.text;
            frag.appendChild(np);
          }
        });
        p.parentNode.replaceChild(frag, p);
      });

      return root.innerHTML;
    }

    function extractTocFromHtml(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString('<div id="root">' + html + '</div>', 'text/html');
      const root = doc.getElementById('root');
      const headings = root.querySelectorAll('h1, h2, h3');
      if (headings.length < 1) return { toc: null, html };

      const toc = [];
      headings.forEach((h, i) => {
        let id = h.id;
        if (!id) {
          id = 'toc-' + i;
          h.id = id;
        }
        const title = h.textContent.trim().slice(0, 80) || `섹션 ${i + 1}`;
        toc.push({
          id,
          title,
          level: parseInt(h.tagName[1], 10) || 2
        });
      });
      return { toc: toc.length ? toc : null, html: root.innerHTML };
    }

    function generateArbitraryToc(html) {
      const textLen = html.replace(/<[^>]+>/g, '').length;
      const parser = new DOMParser();
      const doc = parser.parseFromString('<div id="root">' + html + '</div>', 'text/html');
      const root = doc.getElementById('root');
      const children = Array.from(root.children).filter(el => el.tagName !== 'SCRIPT');

      if (textLen < 2500 || children.length < 6) {
        if (children[0] && !children[0].id) children[0].id = 'start';
        return {
          toc: [{ id: children[0]?.id || 'start', title: '본문', level: 1 }],
          html: root.innerHTML
        };
      }

      // 대략 8~15개 구간으로 나눔
      const targetChunks = Math.min(15, Math.max(6, Math.ceil(textLen / 4000)));
      const chunkSize = Math.max(3, Math.ceil(children.length / targetChunks));
      const toc = [];

      for (let i = 0; i < children.length; i += chunkSize) {
        const id = 'arb-' + i;
        children[i].id = id;
        let preview = (children[i].textContent || '').trim().replace(/\s+/g, ' ').slice(0, 36);
        if (!preview) preview = `구간 ${Math.floor(i / chunkSize) + 1}`;
        if (preview.length >= 36) preview += '…';
        toc.push({ id, title: preview, level: 1 });
      }
      return { toc, html: root.innerHTML };
    }

    // 통합: 콘텐츠 + 목차 생성 (항상 id가 본문에 존재하도록)
    function buildContentAndToc(rawHtmlOrText, isPlainText) {
      let content = isPlainText ? plainToHtml(rawHtmlOrText) : rawHtmlOrText;
      content = promoteChapterParagraphs(content);
      content = enhanceDialogue(content);

      let { toc, html } = extractTocFromHtml(content);
      content = html;

      if (!toc || toc.length < 2) {
        // 헤딩이 거의 없으면 임의 목차 생성 (본문에 id 주입)
        const arb = generateArbitraryToc(content);
        toc = arb.toc;
        content = arb.html;
      }
      return { content, toc };
    }

    // ========== BOOK MANAGEMENT ==========
    function addBook(data) {
      const book = {
        id: uid(),
        title: data.title,
        content: data.content,
        toc: data.toc || [],
        type: data.type || 'txt',
        progress: 0,
        scrollTop: 0,
        finished: false,
        addedAt: Date.now(),
        lastRead: Date.now()
      };
      APP.books.unshift(book);
      DB.save();
      return book;
    }

    function updateBookProgress(id, scrollTop, progress) {
      const book = APP.books.find(b => b.id === id);
      if (!book) return;
      book.scrollTop = scrollTop;
      book.progress = progress;
      book.lastRead = Date.now();
      if (progress > 0.95) book.finished = true;
      DB.save();
    }

    function deleteBook(id) {
      APP.books = APP.books.filter(b => b.id !== id);
      DB.save();
      renderLibrary();
      showToast('삭제되었습니다');
    }

    function markFinished(id) {
      const book = APP.books.find(b => b.id === id);
      if (book) {
        book.finished = true;
        book.progress = 1;
        DB.save();
        showToast('다 읽은 목록으로 이동했습니다');
      }
    }

    // ========== RENDER ==========
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if (id === 'library') renderLibrary();
    }

    function renderLibrary() {
      const list = document.getElementById('libList');
      const filtered = APP.books.filter(b => 
        APP.currentTab === 'reading' ? !b.finished : b.finished
      );

      if (!filtered.length) {
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <p>${APP.currentTab === 'reading' ? '읽는 중인 책이 없습니다' : '다 읽은 책이 없습니다'}</p>
            <p style="font-size:13px;margin-top:8px;opacity:0.7">파일을 열어 서재에 추가하세요</p>
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(b => `
        <div class="book-card" data-id="${b.id}">
          <div class="book-cover">📖</div>
          <div class="book-info">
            <div class="book-title">${escapeHtml(b.title)}</div>
            <div class="book-meta">${formatDate(b.lastRead)} · ${Math.round(b.progress * 100)}%</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${b.progress * 100}%"></div></div>
          </div>
          <button class="book-delete" data-delete="${b.id}" title="삭제">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      `).join('');

      // events
      list.querySelectorAll('.book-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.book-delete')) return;
          openBook(card.dataset.id);
        });
      });
      list.querySelectorAll('.book-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('이 책을 서재에서 삭제할까요?')) {
            deleteBook(btn.dataset.delete);
          }
        });
      });
    }

    function openBook(id) {
      const book = APP.books.find(b => b.id === id);
      if (!book) return;
      APP.currentBookId = id;
      document.getElementById('readerTitle').textContent = book.title;
      
      // Ensure TOC ids exist in content
      let content = book.content;
      if (book.toc && book.toc.length) {
        // Make sure headings have matching ids where possible
        const parser = new DOMParser();
        const doc = parser.parseFromString('<div id="c">' + content + '</div>', 'text/html');
        const root = doc.getElementById('c');
        book.toc.forEach((t, i) => {
          if (!root.querySelector('#' + CSS.escape(t.id))) {
            // try find by text
            const headings = root.querySelectorAll('h1,h2,h3,.epub-chapter');
            if (headings[i]) headings[i].id = t.id;
          }
        });
        content = root.innerHTML;
      }

      document.getElementById('contentInner').innerHTML = content;
      // 현재 글꼴/크기 설정 즉시 반영
      DB.applySettings();

      // 책 열 때 메뉴 항상 표시
      showReaderChrome();

      // restore scroll
      const scroller = document.getElementById('readerContent');
      setTimeout(() => {
        scroller.scrollTop = book.scrollTop || 0;
      }, 50);

      showScreen('reader');
      renderToc(book);
    }

    function renderToc(book) {
      const list = document.getElementById('tocList');
      if (!book.toc || !book.toc.length) {
        list.innerHTML = '<li class="toc-item">목차가 없습니다</li>';
        return;
      }
      list.innerHTML = book.toc.map(t => `
        <li class="toc-item" data-id="${t.id}" style="padding-left:${12 + (t.level-1)*16}px">${escapeHtml(t.title)}</li>
      `).join('');

      list.querySelectorAll('.toc-item').forEach(item => {
        item.addEventListener('click', () => {
          const el = document.getElementById(item.dataset.id);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          closeOverlay('tocOverlay');
        });
      });
    }

    // ========== SCROLL & TOOLBAR AUTO-HIDE ==========
    function showReaderChrome() {
      document.getElementById('readerToolbar').classList.remove('hidden');
      document.getElementById('readerBottom').classList.remove('hidden');
      document.getElementById('reader').classList.remove('chrome-hidden');
      APP.toolbarVisible = true;
    }

    function hideReaderChrome() {
      document.getElementById('readerToolbar').classList.add('hidden');
      document.getElementById('readerBottom').classList.add('hidden');
      document.getElementById('reader').classList.add('chrome-hidden');
      APP.toolbarVisible = false;
    }

    function toggleReaderChrome() {
      if (APP.toolbarVisible) hideReaderChrome();
      else showReaderChrome();
    }

    function setupScrollHide() {
      const scroller = document.getElementById('readerContent');
      let lastY = 0;
      let ticking = false;
      let touchStartY = 0;

      // 스크롤: 아래로 숨김, 위로(또는 맨 위) 표시
      scroller.addEventListener('scroll', () => {
        if (!ticking) {
          requestAnimationFrame(() => {
            const y = scroller.scrollTop;
            const dy = y - lastY;

            if (y <= 20) {
              // 문서 맨 위에서는 항상 표시
              showReaderChrome();
            } else if (dy > 6 && y > 40) {
              hideReaderChrome();
            } else if (dy < -3) {
              showReaderChrome();
            }
            lastY = y;

            if (APP.currentBookId) {
              const max = scroller.scrollHeight - scroller.clientHeight;
              const prog = max > 0 ? Math.min(1, y / max) : 0;
              updateBookProgress(APP.currentBookId, y, prog);
            }
            ticking = false;
          });
          ticking = true;
        }
      }, { passive: true });

      // 본문 탭 → 메뉴 토글 (스크롤과 구분)
      let tapStartX = 0, tapStartY = 0, tapMoved = false;
      scroller.addEventListener('touchstart', (e) => {
        if (!e.touches[0]) return;
        tapStartX = e.touches[0].clientX;
        tapStartY = e.touches[0].clientY;
        touchStartY = tapStartY;
        tapMoved = false;
      }, { passive: true });

      scroller.addEventListener('touchmove', (e) => {
        if (!e.touches[0]) return;
        const dx = Math.abs(e.touches[0].clientX - tapStartX);
        const dy = Math.abs(e.touches[0].clientY - tapStartY);
        if (dx > 8 || dy > 8) tapMoved = true;
      }, { passive: true });

      scroller.addEventListener('touchend', (e) => {
        if (tapMoved) return;
        // 가장자리 탭은 무시(버튼 영역과 겹침 방지)
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        const edge = 16;
        if (t.clientY < edge || t.clientY > window.innerHeight - edge) return;
        toggleReaderChrome();
      }, { passive: true });

      // 데스크탑 클릭
      scroller.addEventListener('click', (e) => {
        // 텍스트 선택 중이거나 링크 등이면 무시
        if (window.getSelection && String(window.getSelection()).length > 0) return;
        if (e.target.closest('a, button')) return;
        toggleReaderChrome();
      });
    }

    // ========== TTS (System) ==========
    function populateVoices() {
      const select = document.getElementById('voiceSelect');
      const voices = speechSynthesis.getVoices();
      select.innerHTML = '';
      // Prefer Korean
      const sorted = [...voices].sort((a, b) => {
        const aKo = a.lang.startsWith('ko') ? 0 : 1;
        const bKo = b.lang.startsWith('ko') ? 0 : 1;
        return aKo - bKo;
      });
      sorted.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        select.appendChild(opt);
      });
      if (!voices.length) {
        select.innerHTML = '<option>사용 가능한 음성 없음</option>';
      }
    }

    function startTTS() {
      if (APP.isSpeaking) {
        speechSynthesis.cancel();
        APP.isSpeaking = false;
        document.getElementById('ttsStatus').textContent = '정지됨';
        return;
      }
      const content = document.getElementById('contentInner');
      const text = content.innerText || content.textContent;
      if (!text.trim()) {
        showToast('읽을 내용이 없습니다');
        return;
      }

      const utter = new SpeechSynthesisUtterance(text.slice(0, 15000)); // limit
      const voiceName = document.getElementById('voiceSelect').value;
      const voices = speechSynthesis.getVoices();
      const voice = voices.find(v => v.name === voiceName);
      if (voice) utter.voice = voice;
      utter.rate = parseFloat(document.getElementById('ttsRate').value) || 1;
      utter.lang = voice ? voice.lang : 'ko-KR';

      utter.onend = () => {
        APP.isSpeaking = false;
        document.getElementById('ttsStatus').textContent = '완료';
      };
      utter.onerror = () => {
        APP.isSpeaking = false;
        document.getElementById('ttsStatus').textContent = '오류 발생';
      };

      speechSynthesis.speak(utter);
      APP.ttsUtterance = utter;
      APP.isSpeaking = true;
      document.getElementById('ttsStatus').textContent = '읽는 중...';
    }

    // ========== EVENT BINDINGS ==========
    function bindEvents() {
      // Home
      document.getElementById('btnLibrary').addEventListener('click', () => showScreen('library'));
      document.getElementById('btnPaste').addEventListener('click', () => {
        document.getElementById('pasteOverlay').classList.add('active');
      });
      document.getElementById('btnOpenFile').addEventListener('click', () => {
        document.getElementById('fileInput').click();
      });

      // Library
      document.getElementById('btnLibBack').addEventListener('click', () => showScreen('home'));
      document.getElementById('btnLibAdd').addEventListener('click', () => {
        document.getElementById('fileInput').click();
      });
      document.querySelectorAll('.lib-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.lib-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          APP.currentTab = tab.dataset.tab;
          renderLibrary();
        });
      });

      // Reader
      document.getElementById('btnReaderBack').addEventListener('click', () => {
        speechSynthesis.cancel();
        APP.isSpeaking = false;
        showScreen('library');
      });
      document.getElementById('btnToc').addEventListener('click', () => {
        document.getElementById('tocOverlay').classList.add('active');
      });
      document.getElementById('btnSettings').addEventListener('click', () => {
        document.getElementById('settingsOverlay').classList.add('active');
      });
      document.getElementById('btnTTS').addEventListener('click', () => {
        populateVoices();
        document.getElementById('ttsOverlay').classList.add('active');
      });
      document.getElementById('btnNight').addEventListener('click', () => {
        APP.settings.night = !APP.settings.night;
        DB.saveSettings();
      });
      // 하단 네비: 서재 / 홈 / 파일 열기 (메뉴가 숨어도 다시 띄운 뒤 이동)
      document.getElementById('btnBottomLib').addEventListener('click', () => {
        speechSynthesis.cancel();
        APP.isSpeaking = false;
        showScreen('library');
      });
      document.getElementById('btnBottomHome').addEventListener('click', () => {
        speechSynthesis.cancel();
        APP.isSpeaking = false;
        showScreen('home');
      });
      document.getElementById('btnBottomOpen').addEventListener('click', () => {
        document.getElementById('fileInput').click();
      });

      // Overlays close
      document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => {
          closeOverlay(btn.dataset.close);
        });
      });
      document.querySelectorAll('.overlay').forEach(ov => {
        ov.addEventListener('click', (e) => {
          if (e.target === ov) ov.classList.remove('active');
        });
      });

      // Settings
      document.querySelectorAll('.font-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          APP.settings.font = btn.dataset.font;
          DB.saveSettings();
        });
      });
      document.getElementById('fontSizeSlider').addEventListener('input', (e) => {
        APP.settings.fontSize = parseInt(e.target.value);
        document.getElementById('fontSizeVal').textContent = e.target.value;
        DB.saveSettings();
      });
      document.getElementById('letterSpacingSlider').addEventListener('input', (e) => {
        APP.settings.letterSpacing = parseInt(e.target.value);
        document.getElementById('letterSpacingVal').textContent = e.target.value;
        DB.saveSettings();
      });
      document.getElementById('lineHeightSlider').addEventListener('input', (e) => {
        APP.settings.lineHeight = parseInt(e.target.value) / 100;
        document.getElementById('lineHeightVal').textContent = APP.settings.lineHeight.toFixed(2);
        DB.saveSettings();
      });
      document.getElementById('nightToggle').addEventListener('click', () => {
        APP.settings.night = !APP.settings.night;
        DB.saveSettings();
      });

      // Paste
      document.getElementById('btnPasteConfirm').addEventListener('click', () => {
        const text = document.getElementById('pasteText').value.trim();
        if (!text) {
          showToast('텍스트를 입력하세요');
          return;
        }
        const title = document.getElementById('pasteTitle').value.trim() || '붙여넣은 텍스트';
        const built = buildContentAndToc(text, true);
        const book = addBook({ title, content: built.content, toc: built.toc, type: 'txt' });
        closeOverlay('pasteOverlay');
        document.getElementById('pasteText').value = '';
        document.getElementById('pasteTitle').value = '';
        openBook(book.id);
      });

      // File
      document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        showLoading(true);
        try {
          const data = await parseFile(file);
          const book = addBook(data);
          showLoading(false);
          openBook(book.id);
          showToast(`"${book.title}" 추가됨`);
        } catch (err) {
          console.error(err);
          showLoading(false);
          showToast('파일을 열 수 없습니다: ' + (err.message || '오류'));
        }
        e.target.value = '';
      });

      // TTS
      document.getElementById('btnTTSPlay').addEventListener('click', startTTS);
      document.getElementById('btnTTSStop').addEventListener('click', () => {
        speechSynthesis.cancel();
        APP.isSpeaking = false;
        document.getElementById('ttsStatus').textContent = '정지됨';
      });
      document.getElementById('ttsRate').addEventListener('input', (e) => {
        document.getElementById('ttsRateVal').textContent = parseFloat(e.target.value).toFixed(1);
      });

      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoices;
      }
    }

    function closeOverlay(id) {
      document.getElementById(id).classList.remove('active');
    }

    // ========== PWA SERVICE WORKER ==========
    function registerSW() {
      if (!('serviceWorker' in navigator)) return;
      const swCode = `
        const CACHE = 'lumina-v1';
        const ASSETS = ['./', './index.html'];
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));
        });
        self.addEventListener('activate', e => {
          e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(
            caches.match(e.request).then(r => r || fetch(e.request).then(res => {
              if (e.request.url.startsWith('http') && res.ok) {
                const clone = res.clone();
                caches.open(CACHE).then(c => c.put(e.request, clone));
              }
              return res;
            }).catch(() => caches.match('./index.html')))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(err => console.log('SW reg failed', err));
    }

    // ========== INIT ==========
    DB.load();
    bindEvents();
    setupScrollHide();
    registerSW();
    // Initial theme
    DB.applySettings();
  </script>
